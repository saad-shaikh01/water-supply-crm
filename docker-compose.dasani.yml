# ─── Data Layer Only — DASANI ENTERPRISES tenant ────────────────────────────────
# Fully isolated PostgreSQL + Redis for the Dasani production deployment.
# Runs alongside (not instead of) docker-compose.prod.yml's wscrm-postgres /
# wscrm-redis, on different loopback ports so both stacks coexist on one VPS.
#
# Usage:
#   docker compose --env-file .env.live -f docker-compose.dasani.yml up -d --wait
#   docker compose --env-file .env.live -f docker-compose.dasani.yml down

networks:
  dasani_data:
    driver: bridge

volumes:
  dasani_postgres_data:
  dasani_redis_data:

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  dasani-postgres:
    image: postgres:15-alpine
    container_name: dasani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dasani_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Loopback-only. NOT 5432 (wscrm-postgres/testinglinq) and NOT 5433
      # (that collides with an unrelated project's sentra_postgres_testing
      # container on this VPS). Dasani's api-backend connects via 5435.
      - "127.0.0.1:5435:5432"
    networks:
      - dasani_data

  # ── Redis ─────────────────────────────────────────────────────────────────────
  dasani-redis:
    image: redis:7-alpine
    container_name: dasani-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - dasani_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      # Loopback-only. NOT 6379 (wscrm-redis/testinglinq) and NOT 6380 (that
      # collides with an unrelated project's sentra_redis_testing container
      # on this VPS). Dasani's api-backend connects via 6382.
      - "127.0.0.1:6382:6379"
    networks:
      - dasani_data
