# /etc/nginx/sites-available/water-supply-crm.conf
#
# COMPLETE HTTP + HTTPS config — deployed by deploy/deploy.sh on every push.
# SSL certificates are managed by Let's Encrypt / Certbot and must be
# provisioned ONCE on a fresh VPS before the first deploy:
#
#   sudo certbot certonly --nginx \
#     -d backend.testinglinq.com \
#     -d admin.testinglinq.com \
#     -d vendor.testinglinq.com \
#     -d portal.testinglinq.com
#
# After that, deploy/deploy.sh is fully idempotent — it copies this file,
# tests it (nginx -t), and reloads.  Certbot's auto-renewal cron keeps the
# certs fresh; it does NOT modify this file.
#
# All four domains share one SAN certificate stored under the primary domain
# (backend.testinglinq.com).
#
# Root-cause note: if Certbot's --nginx mode was used previously it may have
# written its own 443 blocks without proxy_set_header Host $host, causing
# Next.js middleware to build redirect URLs like https://localhost:4311/…
# This file fixes that permanently: all four HTTPS blocks explicitly set
# Host and X-Forwarded-Proto so Next.js always sees the real domain.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────────────────────
# backend.testinglinq.com  (NestJS API — port 3100)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name backend.testinglinq.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.testinglinq.com;

    ssl_certificate     /etc/letsencrypt/live/backend.testinglinq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.testinglinq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # SSE endpoint — disable all buffering so events stream immediately
    location /api/tracking/subscribe {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Connection         '';
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# admin.testinglinq.com  (Admin Panel Next.js — port 4310)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.testinglinq.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.testinglinq.com;

    ssl_certificate     /etc/letsencrypt/live/backend.testinglinq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.testinglinq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# vendor.testinglinq.com  (Vendor Dashboard Next.js — port 4311)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vendor.testinglinq.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vendor.testinglinq.com;

    ssl_certificate     /etc/letsencrypt/live/backend.testinglinq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.testinglinq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── PWA: service worker — must never be cached so updates deploy immediately.
    # proxy_hide_header strips any Cache-Control the Next.js server emits so our
    # directive is the only one the browser sees.  Service-Worker-Allowed: / lets
    # the SW control every path even though it is registered from the root.
    location = /sw.js {
        proxy_pass http://127.0.0.1:4311;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_hide_header Cache-Control;
        add_header        Cache-Control      "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header        Service-Worker-Allowed "/";
    }

    # ── PWA: workbox runtime chunks generated alongside sw.js — also no-cache.
    location ~* ^/workbox- {
        proxy_pass http://127.0.0.1:4311;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_hide_header Cache-Control;
        add_header        Cache-Control      "no-store, no-cache, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:4311;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

