# /etc/nginx/sites-available/dasani-enterprises.conf
#
# COMPLETE HTTP + HTTPS config for the DASANI ENTERPRISES tenant — deployed by
# deploy/deploy-dasani.sh on every push. Coexists with
# /etc/nginx/sites-available/water-supply-crm.conf (testinglinq.com) on the
# same VPS; different server_names, different upstream ports, no overlap.
#
# SSL certificates are managed by Let's Encrypt / Certbot and must be
# provisioned ONCE before the first deploy:
#
#   sudo certbot certonly --nginx \
#     -d api.dasanienterprises.com \
#     -d admin.dasanienterprises.com \
#     -d vendor.dasanienterprises.com \
#     -d app.dasanienterprises.com
#
# After that, deploy-dasani.sh is fully idempotent — it copies this file,
# tests it (nginx -t), and reloads. Certbot's auto-renewal cron keeps the
# certs fresh; it does NOT modify this file.
#
# All four domains share one SAN certificate stored under the primary domain
# (api.dasanienterprises.com).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────────────────────
# api.dasanienterprises.com  (NestJS API — port 3200)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.dasanienterprises.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dasanienterprises.com;

    ssl_certificate     /etc/letsencrypt/live/api.dasanienterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dasanienterprises.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # SSE endpoint — disable all buffering so events stream immediately
    location /api/tracking/subscribe {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Connection         '';
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# admin.dasanienterprises.com  (Admin Panel Next.js — port 4320)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.dasanienterprises.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.dasanienterprises.com;

    ssl_certificate     /etc/letsencrypt/live/api.dasanienterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dasanienterprises.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# vendor.dasanienterprises.com  (Vendor Dashboard Next.js — port 4321)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vendor.dasanienterprises.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vendor.dasanienterprises.com;

    ssl_certificate     /etc/letsencrypt/live/api.dasanienterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dasanienterprises.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── PWA: service worker — must never be cached so updates deploy immediately.
    location = /sw.js {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_hide_header Cache-Control;
        add_header        Cache-Control      "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header        Service-Worker-Allowed "/";
    }

    # ── PWA: workbox runtime chunks generated alongside sw.js — also no-cache.
    location ~* ^/workbox- {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_hide_header Cache-Control;
        add_header        Cache-Control      "no-store, no-cache, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

