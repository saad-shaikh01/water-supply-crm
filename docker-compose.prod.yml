# ─── Data Layer Only ────────────────────────────────────────────────────────────
# PostgreSQL and Redis are the ONLY services that run in Docker.
# The API backend and all Next.js frontends run directly on the host via PM2.
#
# Both containers publish exclusively to the loopback interface (127.0.0.1) so
# host-level Nginx and PM2 processes can reach the databases without exposing
# any database port to the public internet.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --wait
#   docker compose -f docker-compose.prod.yml down

networks:
  wscrm_data:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: wscrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Loopback-only: host apps connect via 127.0.0.1:5432
      - "127.0.0.1:5432:5432"
    networks:
      - wscrm_data

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wscrm-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      # Loopback-only: host apps connect via 127.0.0.1:6379
      - "127.0.0.1:6379:6379"
    networks:
      - wscrm_data
